name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:vocabulary -- --check
        name: Vocabulary is generated from spec/VOCABULARY.md
      - run: pnpm -r build
      - run: node scripts/gen-schemas.mjs --check
        name: spec/schemas match @axe/core
      - run: pnpm check:snippets
        name: Doc code blocks match docs/examples
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Conformance against the getting-started example
        run: node scripts/ci-conformance.mjs
      - name: Install site browsers
        run: pnpm --filter body-spray-site exec playwright install --with-deps chromium firefox webkit
      - run: pnpm site:build
      - name: site/dist is committed and up to date
        run: git diff --exit-code -- site/dist ':!site/dist/assets/og.png'
      - run: pnpm site:test
